name: Lumen KVM validation host 3
"on":
  push:
    branches: ["codex/lumen-kvm-host-*"]
    paths: [".github/workflows/lumen-kvm-host-ci3.yml", ".ci/lumen-kvm-host-ci3.py"]
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run third isolated authenticated validation host
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_SERVER: "32.236.231.108"
          CLIENT_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFGT6B93bLiiwr6RpqdxkZCQnqTCWh28edqsPD7rHI0z root@ff"
          TASK_SERVER_HOST_KEY: "[32.236.231.108]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEfobji4EhqACkks/y5Luj53yp1ofCVm7+m0UMRvEzND"
        run: python3 .ci/lumen-kvm-host-ci3.py
      - name: Preserve dependency bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-ci3-bootstrap-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          path: |
            ~/.lumen-kvm-host-ci3/bootstrap/host-dependencies.json
            ~/.lumen-kvm-host-ci3/bootstrap/apt-*.log
            ~/.lumen-kvm-host-ci3/bootstrap/dpkg-verify.log
            ~/.lumen-kvm-host-ci3/emulator-dependencies.json
            ~/.lumen-kvm-host-ci3/ssh-bootstrap.json
